<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>All weeks</title>
<style>
:root {
  --bg: #fbfaf7; --ink: #1f1d1a; --muted: #6b665e; --faint: #746d62;
  --rule: #e6e2da; --accent: #7a4b1f; --visited: #7d6d5b;
  --track: #ebe6dc; --fill: #b07a45; --chip: #f2eee6;
  --on: #1f1d1a; --onink: #fbfaf7;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17171a; --ink: #e8e4dc; --muted: #a29d94; --faint: #98938a;
    --rule: #2c2c31; --accent: #e0b07c; --visited: #a8998a;
    --track: #2c2c31; --fill: #c8915a; --chip: #222226;
    --on: #e8e4dc; --onink: #17171a;
  }
}
* { box-sizing: border-box; }
html { scroll-padding-top: 3.75rem; }
/* System fonts so the page draws at once with no download; Charter and
   Iowan ship with Apple devices and read well at small sizes. */
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 17px/1.5 Charter, "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  -webkit-text-size-adjust: 100%;
}
main { max-width: 40rem; margin: 0 auto; padding: 0.75rem 16px 3rem; }
nav, .meta, .closest, .vote, .runline, .legend, .chips, .cal, .yr, .weeks .count, footer {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
a:focus-visible, summary:focus-visible {
  outline: 3px solid var(--accent); outline-offset: 2px;
}
h1 { font-size: 1.5rem; line-height: 1.2; margin: 0.4rem 0 0.2rem; }
.runline {
  color: var(--muted); font-size: 0.8rem; line-height: 1.4;
  margin: 0 0 0.6rem; max-width: 60rem;
}
/* The day is the largest thing on the list, above the papers it holds. */
h2 {
  display: flex; justify-content: space-between; align-items: baseline;
  margin: 0.6rem 0 0; padding: 0.9rem 0 0.4rem;
  background: var(--bg); border-bottom: 2px solid var(--ink);
  font-size: 1.3rem; font-weight: 700; line-height: 1.2;
}
h2 .count { font: 400 0.85rem/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--muted); }

/* The row of seven days, all of them together, and the month. It stays at
   the top of the screen while Jake scrolls a long day. */
.strip {
  position: sticky; top: 0; z-index: 2; margin: 0 -16px;
  background: var(--bg); border-bottom: 1px solid var(--rule);
}
.strip ul {
  display: grid; grid-template-columns: repeat(9, 1fr);
  list-style: none; margin: 0; padding: 0;
}
.strip a, .strip span.off {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 52px; color: var(--ink); text-decoration: none; line-height: 1.15;
}
.strip .dow { font-size: 0.7rem; color: var(--muted); }
.strip .dom { font-size: 1.05rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.strip .word { font-size: 0.85rem; font-weight: 600; color: var(--accent); }
/* A phone has no room for the counts. */
.strip .n { display: none; }
.strip .off .dom { color: var(--faint); font-weight: 400; }
.strip a:hover .dom, .strip a:hover .word { text-decoration: underline; }
.strip li:nth-child(8) { border-left: 1px solid var(--rule); }
.strip a:focus-visible { outline-offset: -3px; }
/* A day of an earlier week opens at the top of its page, so that the dates
   with their year and the way back to the new papers are in view. */
.weekpage section.day, .weekpage #all { scroll-margin-top: 1000rem; }
/* The newest day's cell goes to the top of the main page, where the links to
   the two other lists are. */
section.latest { scroll-margin-top: 1000rem; }

/* Links to the lists that are not a day's, and to the years of the list of
   weeks. */
.chips {
  display: flex; flex-wrap: wrap; gap: 0.4rem;
  margin: 0.6rem 0 0; padding: 0; list-style: none;
}
.chips a {
  display: flex; align-items: center; min-height: 44px; padding: 0 0.8rem;
  border-radius: 0.5rem; background: var(--chip); color: var(--ink);
  text-decoration: none; font-size: 0.85rem;
}
.chips .count { color: var(--muted); margin-left: 0.4em; }
/* The earlier and the later day or week, one at each end of a line. */
.steps { display: flex; justify-content: space-between; gap: 0.5rem; margin: 0.6rem 0; }
.steps a {
  display: flex; align-items: center; min-height: 48px; padding: 0 0.9rem;
  border-radius: 0.5rem; background: var(--chip); color: var(--ink);
  text-decoration: none; font-size: 0.9rem;
}
.steps a:hover { text-decoration: underline; }
.steps .next { margin-left: auto; text-align: right; }
/* A week's or a month's title, between links to its neighbors. */
.head { display: flex; align-items: center; gap: 0.5rem; max-width: 34rem; margin-bottom: 0.4rem; }
.head h1 { flex: 1; margin: 0; text-align: center; font-size: 1.3rem; }
.head a, .head .gap {
  flex: none; display: flex; align-items: center; justify-content: center;
  width: 48px; height: 48px;
}
.head a {
  border-radius: 0.5rem; background: var(--chip); color: var(--ink);
  text-decoration: none; font-size: 1.6rem; line-height: 1;
}
.crumbs { font-size: 0.9rem; }
.crumbs a { text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }

/* The papers. */
section { counter-reset: pick; }
/* The program lists each day's picks closest first, so a number lets Jake
   see how far down the ranking a paper sits. */
article {
  counter-increment: pick; position: relative;
  padding: 0.65rem 0 0.6rem 2rem; border-bottom: 1px solid var(--rule);
}
article::before {
  content: counter(pick); position: absolute; left: 0; top: 0.85rem;
  font: 0.75rem/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-variant-numeric: tabular-nums; color: var(--faint);
}
.title {
  display: block; color: var(--ink); text-decoration: none;
  font-size: 1.1rem; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere;
}
/* A visited title fades, which shows Jake which papers he has opened. */
.title:visited { color: var(--visited); }
.title:hover, .title:focus { text-decoration: underline; }
.meta { color: var(--muted); font-size: 0.85rem; margin: 0.3rem 0 0; }
.source { font-style: italic; }
.reason { margin: 0.45rem 0 0; }
/* The reasons are empty; an empty paragraph would only add space. */
.reason:empty { display: none; }
/* The first lines of the abstract sit in the summary, the part of a
   details element that shows while it is closed, so Jake can read the
   start of every abstract while he scrolls. A tap opens the whole text. */
.abstract { margin: 0.4rem 0 0; }
.abstract summary { display: block; cursor: pointer; list-style: none; }
.abstract summary::-webkit-details-marker { display: none; }
.abstract summary .text {
  display: -webkit-box; -webkit-box-orient: vertical;
  -webkit-line-clamp: 4; overflow: hidden;
  padding-left: 0.75rem; border-left: 2px solid var(--rule);
  font-size: 0.92rem; line-height: 1.45; color: var(--ink);
  overflow-wrap: anywhere;
}
.abstract[open] summary .text { -webkit-line-clamp: unset; display: block; }
.abstract summary::after {
  content: "Show all"; display: block; margin: 0.15rem 0 0 0.75rem;
  color: var(--accent); font-size: 0.75rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
.abstract[open] summary::after { content: "Show less"; }
/* The closest line and the vote links share one line, wrapping on a
   narrow phone, so each paper takes fewer lines. */
.foot {
  display: flex; flex-wrap: wrap; align-items: center;
  gap: 0.2rem 1rem; margin: 0.35rem 0 0;
}
.foot > p { margin: 0; }
.closest {
  display: flex; align-items: flex-start; gap: 0.5rem;
  color: var(--muted); font-size: 0.8rem;
}
/* The bar restates the angle: empty at 90 degrees, the angle between
   papers that share no word, and full at 30 degrees or less. */
.meter {
  flex: none; margin-top: 0.45em; width: 2.5rem; height: 0.3rem; border-radius: 1px;
  background: var(--track); overflow: hidden;
}
.meter span { display: block; height: 100%; background: var(--fill); }
.vote { display: flex; gap: 0.5rem; font-size: 0.8rem; }
/* Vote links look quiet, 28 pixels tall, and take a tap over 44 pixels. */
.vote a {
  display: inline-flex; align-items: center; min-height: 1.75rem; position: relative;
  padding: 0 0.7rem; border-radius: 1rem; background: var(--chip);
  color: var(--muted); text-decoration: none;
}
.vote a::after { content: ""; position: absolute; inset: -8px -3px; }
.vote a:hover, .vote a:focus { color: var(--accent); }

/* The month pages: a calendar, the months and years, and the titles. */
.cal { border-collapse: collapse; width: 100%; max-width: 34rem; table-layout: fixed; margin: 0.4rem 0 0; }
.cal th { font-size: 0.75rem; font-weight: 600; color: var(--muted); padding: 0.3rem 0; }
.cal td, .cal tbody th { padding: 0; border: 1px solid var(--rule); text-align: center; }
.cal a, .cal .none {
  display: flex; flex-direction: column; justify-content: center; min-height: 48px;
  color: var(--ink); text-decoration: none; font-size: 1rem; line-height: 1.15;
  font-weight: 600; font-variant-numeric: tabular-nums;
}
.cal .none { color: var(--faint); font-weight: 400; }
.cal a:hover { background: var(--chip); text-decoration: underline; }
.cal .k { font-size: 0.7rem; font-weight: 400; color: var(--muted); }
.cal tbody th a { font-size: 0.75rem; color: var(--accent); background: var(--chip); }
.yr {
  display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; max-width: 34rem;
  margin: 0.6rem 0 0; padding: 0; list-style: none;
}
.yr a, .yr span {
  display: flex; align-items: center; justify-content: center; min-height: 44px;
  border-radius: 0.4rem; font-size: 0.85rem; color: var(--ink);
  text-decoration: none; background: var(--chip);
}
.yr span { color: var(--faint); background: none; }
.yr a[aria-current] { background: var(--on); color: var(--onink); }
.tl { list-style: none; counter-reset: t; padding: 0; margin: 0; }
.tl li {
  counter-increment: t; position: relative;
  padding: 0.55rem 0 0.5rem 2rem; border-bottom: 1px solid var(--rule);
}
.tl li::before {
  content: counter(t); position: absolute; left: 0; top: 0.8rem;
  font: 0.75rem/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--faint);
}
.tl .title { font-size: 1rem; }
.tl .meta { margin: 0.1rem 0 0; font-size: 0.8rem; }
.months h2 { position: sticky; top: 0; z-index: 1; }
.months h2 a { color: inherit; text-decoration: none; }
.months h2 a:hover { text-decoration: underline; }

/* The list of weeks. */
.weeks { list-style: none; padding: 0; margin: 0; }
.weeks li { display: flex; align-items: center; gap: 0.4rem; border-bottom: 1px solid var(--rule); }
.weeks a {
  display: flex; align-items: center; min-height: 44px;
  color: var(--ink); font-weight: 600; text-decoration: none;
}
.weeks a:hover, .weeks a:focus { text-decoration: underline; }
.weeks .count { color: var(--muted); font-size: 0.85rem; white-space: nowrap; }
.wk > div:first-child h2 { margin-top: 0; }
.wk h2 { font-size: 1.05rem; border-bottom-width: 1px; }

.legend { color: var(--muted); font-size: 0.85rem; margin: 2rem 0 0; max-width: 40rem; }
footer { color: var(--muted); font-size: 0.8rem; margin-top: 1rem; }
footer a, .crumbs a { display: inline-block; padding: 0.7rem 0.9rem 0.7rem 0; color: var(--accent); }

/* On a desktop a single 40rem column left most of the screen empty, so each
   paper becomes two columns: the paper on the left and its abstract on the
   right. The list stays one column of papers in rank order. The abstract
   column is capped at about 75 characters a line, and the page width is
   the sum of the columns so no strip is left over at the right. Below
   62rem the abstract would fall under about 60 characters a line. */
@media (min-width: 62rem) {
  html { scroll-padding-top: 4.5rem; }
  main { max-width: 68.5rem; padding-left: 24px; padding-right: 24px; }
  footer { max-width: 40rem; }
  .strip { margin: 0; }
  .strip a, .strip span.off { min-height: 60px; }
  .strip .n { display: block; font-size: 0.75rem; color: var(--muted); }
  .strip .dow { font-size: 0.8rem; }
  /* The second row takes any height the abstract adds, so the closest
     line and the votes stay right under the reason. */
  article {
    display: grid; grid-template-columns: 27rem minmax(0, 34rem);
    grid-template-rows: auto 1fr; column-gap: 2.5rem;
  }
  .lead { grid-column: 1; grid-row: 1; }
  .foot { grid-column: 1; grid-row: 2; align-self: start; }
  .abstract { grid-column: 2; grid-row: 1 / 3; margin: 0; }
  .tl { columns: 2; column-gap: 2.5rem; }
  .tl li { break-inside: avoid; }
  .months-top { display: grid; grid-template-columns: 34rem 1fr; column-gap: 2.5rem; align-items: start; }
  .wk { columns: 2; column-gap: 2.5rem; }
  .wk div { break-inside: avoid; }
}
@media print { nav { display: none; } }

</style>
</head>
